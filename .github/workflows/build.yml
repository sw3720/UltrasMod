name: Build UltrasMod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source/source-*.b64 | base64 --decode > /tmp/UltrasMod_source.tar.gz
          tar -tzf /tmp/UltrasMod_source.tar.gz >/dev/null
          tar -xzf /tmp/UltrasMod_source.tar.gz -C .
          cp patches/SupporterFlagBlock.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/block/SupporterFlagBlock.java
          cp patches/UltrasMod.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/UltrasMod.java
          cp patches/UltrasModClient.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/UltrasModClient.java
          cp patches/UltrasFanStandItem.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/item/UltrasFanStandItem.java
          cp patches/FlagArtScreen.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/client/FlagArtScreen.java
          rm -f UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/item/UltrasFanSpawnEggItem.java
          cp patches/SupporterCanvasItem.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/item/SupporterCanvasItem.java
          cp patches/SupporterFlagControllerItem.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/item/SupporterFlagControllerItem.java
          rm -f UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/entity/UltrasFanEntity.java
          rm -f UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/client/UltrasFanRenderer.java
          cp patches/SupporterSoundItem.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/item/SupporterSoundItem.java
          cp patches/SupporterMegaphoneItem.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/item/SupporterMegaphoneItem.java
          cp patches/SupporterSmokeItem.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/item/SupporterSmokeItem.java

      - name: Generate art and original supporter sounds
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python tools/generate_assets.py UltrasMod_Fabric_1.21.4/src/main/resources/assets/ultrasmod/textures
          sed -i 's/^mod_version=0.3.5$/mod_version=0.4.14/' UltrasMod_Fabric_1.21.4/gradle.properties
          test -s UltrasMod_Fabric_1.21.4/src/main/resources/assets/ultrasmod/sounds/megaphone_call.ogg
          test -s UltrasMod_Fabric_1.21.4/src/main/resources/assets/ultrasmod/sounds/drum_hit.ogg
          test -s UltrasMod_Fabric_1.21.4/src/main/resources/assets/ultrasmod/sounds/clapper.ogg

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Fabric mod
        working-directory: UltrasMod_Fabric_1.21.4
        run: gradle --no-daemon build

      - name: Verify distributable JAR and embedded assets
        working-directory: UltrasMod_Fabric_1.21.4
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/ultras-mod-0.4.14.jar
          test -s "$JAR"
          jar tf "$JAR" > /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/textures/block/flag_cloth.png' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/textures/block/flag_cloth_00.png' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/textures/block/banner_cloth_00.png' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/blockstates/supporter_flag.json' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/models/block/supporter_banner_part_35.json' /tmp/ultrasmod-jar-contents.txt
          grep -q 'kr/ultrasmod/item/SupporterCanvasItem.class' /tmp/ultrasmod-jar-contents.txt
          grep -q 'kr/ultrasmod/item/UltrasFanStandItem.class' /tmp/ultrasmod-jar-contents.txt
          grep -q 'kr/ultrasmod/client/FlagArtScreen.class' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/items/ultras_supporter_stand_green.json' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/models/item/ultras_supporter_stand_green.json' /tmp/ultrasmod-jar-contents.txt
          if grep -q 'ultras_fan_spawn_egg' /tmp/ultrasmod-jar-contents.txt; then echo 'Legacy spawn-egg assets must not be packaged'; exit 1; fi
          if grep -q 'kr/ultrasmod/entity/UltrasFanEntity.class' /tmp/ultrasmod-jar-contents.txt; then echo 'Zombie-based ultras entity must not be packaged'; exit 1; fi
          for team in blue red yellow black white purple orange; do
            grep -q "assets/ultrasmod/items/supporter_hand_flag_${team}.json" /tmp/ultrasmod-jar-contents.txt
            grep -q "assets/ultrasmod/models/item/supporter_hand_flag_${team}.json" /tmp/ultrasmod-jar-contents.txt
            grep -q "assets/ultrasmod/textures/item/supporter_hand_flag_${team}.png" /tmp/ultrasmod-jar-contents.txt
          done
          grep -q 'kr/ultrasmod/item/SupporterMegaphoneItem.class' /tmp/ultrasmod-jar-contents.txt
          grep -q 'kr/ultrasmod/item/SupporterFlagControllerItem.class' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/items/supporter_flag_controller.json' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/models/item/supporter_flag_controller.json' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/textures/item/supporter_flag_controller.png' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/items/supporter_hand_flag.json' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/models/item/supporter_hand_flag.json' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/items/supporter_scarf.json' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/models/item/supporter_scarf.json' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/sounds/megaphone_call.ogg' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/sounds/drum_hit.ogg' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/sounds/clapper.ogg' /tmp/ultrasmod-jar-contents.txt
          echo "Built and inspected: $JAR"
          ls -lh "$JAR"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: UltrasMod-Fabric-1.21.4-v0.4.14
          path: UltrasMod_Fabric_1.21.4/build/libs/ultras-mod-0.4.14.jar
          if-no-files-found: error
          retention-days: 30

      - name: Smoke-test Fabric client startup
        working-directory: UltrasMod_Fabric_1.21.4
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth
          rm -rf run
          set +e
          timeout --signal=TERM --kill-after=10s 100s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 gradle --no-daemon runClient > /tmp/ultrasmod-client-run.log 2>&1
          client_status=$?
          set -e
          if [ -f run/logs/latest.log ]; then
            cat run/logs/latest.log >> /tmp/ultrasmod-client-run.log
          fi
          tail -n 100 /tmp/ultrasmod-client-run.log
          if grep -Eq 'Block id not set|Item id not set|Could not execute entrypoint|ExceptionInInitializerError' /tmp/ultrasmod-client-run.log; then
            echo "Fabric client startup reported an initialization error."
            exit 1
          fi
          if ! grep -q 'Created: 1024x512x0 minecraft:textures/atlas/gui.png-atlas' /tmp/ultrasmod-client-run.log; then
            echo "Fabric client did not reach the GUI texture initialization stage."
            exit 1
          fi
          if [ "$client_status" -ne 0 ] && [ "$client_status" -ne 124 ] && [ "$client_status" -ne 143 ]; then
            echo "Fabric client exited unexpectedly with status $client_status."
            exit "$client_status"
          fi
          echo "Fabric client reached GUI texture initialization; headless smoke test passed."

      - name: Upload restored project sources for inspection
        uses: actions/upload-artifact@v4
        with:
          name: UltrasMod-project-source
          path: |
            UltrasMod_Fabric_1.21.4/src/main/
            UltrasMod_Fabric_1.21.4/gradle.properties
            UltrasMod_Fabric_1.21.4/build.gradle
          if-no-files-found: error
          retention-days: 7
