name: Build UltrasMod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source/source-*.b64 | base64 --decode > /tmp/UltrasMod_source.tar.gz
          tar -tzf /tmp/UltrasMod_source.tar.gz >/dev/null
          tar -xzf /tmp/UltrasMod_source.tar.gz -C .
          cp patches/UltrasFanEntity.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/entity/UltrasFanEntity.java
          cp patches/SupporterFlagBlock.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/block/SupporterFlagBlock.java
          cp patches/UltrasMod.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/UltrasMod.java
          cp patches/UltrasFanSpawnEggItem.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/item/UltrasFanSpawnEggItem.java
          cp patches/SupporterSoundItem.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/item/SupporterSoundItem.java
          cp patches/SupporterSmokeItem.java UltrasMod_Fabric_1.21.4/src/main/java/kr/ultrasmod/item/SupporterSmokeItem.java

      - name: Generate art and original supporter sounds
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python tools/generate_assets.py UltrasMod_Fabric_1.21.4/src/main/resources/assets/ultrasmod/textures
          sed -i 's/^mod_version=0.3.5$/mod_version=0.3.6/' UltrasMod_Fabric_1.21.4/gradle.properties
          test -s UltrasMod_Fabric_1.21.4/src/main/resources/assets/ultrasmod/sounds/megaphone_call.ogg
          test -s UltrasMod_Fabric_1.21.4/src/main/resources/assets/ultrasmod/sounds/drum_hit.ogg
          test -s UltrasMod_Fabric_1.21.4/src/main/resources/assets/ultrasmod/sounds/clapper.ogg

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Fabric mod
        working-directory: UltrasMod_Fabric_1.21.4
        run: gradle --no-daemon build

      - name: Verify distributable JAR and embedded assets
        working-directory: UltrasMod_Fabric_1.21.4
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/ultras-mod-0.3.6.jar
          test -s "$JAR"
          jar tf "$JAR" > /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/textures/block/flag_cloth.png' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/sounds/megaphone_call.ogg' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/sounds/drum_hit.ogg' /tmp/ultrasmod-jar-contents.txt
          grep -q 'assets/ultrasmod/sounds/clapper.ogg' /tmp/ultrasmod-jar-contents.txt
          echo "Built and inspected: $JAR"
          ls -lh "$JAR"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: UltrasMod-Fabric-1.21.4-v0.3.6
          path: UltrasMod_Fabric_1.21.4/build/libs/ultras-mod-0.3.6.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload restored project sources for inspection
        uses: actions/upload-artifact@v4
        with:
          name: UltrasMod-project-source
          path: |
            UltrasMod_Fabric_1.21.4/src/main/
            UltrasMod_Fabric_1.21.4/gradle.properties
            UltrasMod_Fabric_1.21.4/build.gradle
          if-no-files-found: error
          retention-days: 7
